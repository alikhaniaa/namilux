# Installed by provision.sh as /etc/postgresql/16/main/conf.d/namilux.conf (Ubuntu 24.04 ships 16).
# Sized for the recommended 4 vCPU / 8 GB box (infra/server/README.md §1); the two commented lines are
# the 2 GB demo box values. Postgres listens on loopback only - never on the public interface.
listen_addresses = '127.0.0.1, ::1'
max_connections = 60                      # pools: web 10 (×2 during a swap) + admin 5 + worker 5 + migrate 1 + headroom
shared_buffers = 2GB                      # 2 GB box: 512MB
effective_cache_size = 6GB                # 2 GB box: 1200MB
work_mem = 16MB
maintenance_work_mem = 256MB
wal_buffers = 64MB
wal_compression = on
checkpoint_completion_target = 0.9
max_wal_size = 2GB
random_page_cost = 1.1                    # NVMe
effective_io_concurrency = 200
default_statistics_target = 100
log_min_duration_statement = 500          # ms - the slow-query line of the spec
log_line_prefix = '%m [%p] %u@%d '
log_timezone = 'UTC'
timezone = 'UTC'
idle_in_transaction_session_timeout = 300000
password_encryption = scram-sha-256
